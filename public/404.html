<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Apex iPhone</title>
    <!--
      Served by GitHub Pages for any path it cannot resolve. Without it, a mistyped
      URL or an old bookmark lands on GitHub's own error page, which reads as though
      the whole store is gone rather than as a wrong address.

      Kept in public/ because Vite only emits the HTML files listed in
      rollupOptions.input; a 404.html in the project root would never reach dist/.
      public/ is copied verbatim.

      The styling is inline and the link is relative, so this page cannot itself
      404 - a broken 404 is the worst possible place to discover a path problem.
    -->
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 2rem;
      }
      h1 { font-size: 4rem; margin: 0 0 0.25rem; }
      p { margin: 0 0 1.5rem; opacity: 0.75; }
      a.btn {
        display: inline-block;
        padding: 0.7rem 1.4rem;
        border-radius: 0.5rem;
        background: #111;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        a.btn { background: #fff; color: #111; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>We could not find that page.</p>
      <a class="btn" href="./">Back to the store</a>
    </main>
  </body>
</html>
